# LendFast training API server — NAS deployment behind Traefik.
#
# Replace HOSTNAME with your route (e.g. api-training.l.zozac.com.au) and
# ADMIN_PASSWORD with a strong password, then deploy from the stacks directory:
#
#   docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
#     -v /Volume1/docker/.stacks/zozac/training-api:/Volume1/docker/.stacks/zozac/training-api \
#     -w /Volume1/docker/.stacks/zozac/training-api docker:cli compose -p training-api up -d --build
#
# Data lands in /Volume1/docker/training-api (a directory named after the container,
# which is the house convention), not a named volume.
services:
  training-api:
    build: .
    container_name: training-api
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      RATE_LIMIT: "5000"
      RATE_WINDOW_MINUTES: "15"
    volumes:
      - /Volume1/docker/training-api:/data
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.training-api.rule=Host(`HOSTNAME`)"
      - "traefik.http.routers.training-api.entrypoints=websecure"
      - "traefik.http.routers.training-api.tls.certresolver=cloudflare"
      - "traefik.http.services.training-api.loadbalancer.server.port=8080"
    restart: unless-stopped

networks:
  traefik_default:
    external: true
